services:
  web:
    image: moodlehq/moodle-php-apache:8.3
    container_name: moodle_web
    restart: unless-stopped
    ports:
      - "${MOODLE_WEB_PORT:-8080}:80"
    environment:
      APACHE_DOCUMENT_ROOT: /var/www/html/public
    volumes:
      - ./moodle:/var/www/html
      - ./moodledata:/var/www/moodledata
      - ./docker/php.ini:/usr/local/etc/php/conf.d/moodle.ini:ro
    depends_on:
      db:
        condition: service_healthy
    networks:
      - moodle-net

  db:
    image: mariadb:11.4
    container_name: moodle_db
    restart: unless-stopped
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --innodb-file-per-table=1
      - --innodb-buffer-pool-size=512M
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-moodleroot}
      MYSQL_DATABASE: ${DB_NAME:-moodle}
      MYSQL_USER: ${DB_USER:-moodleuser}
      MYSQL_PASSWORD: ${DB_PASSWORD:-moodlepass}
    ports:
      - "${DB_PORT:-3307}:3306"
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 15
    networks:
      - moodle-net

  phpmyadmin:
    image: phpmyadmin:latest
    container_name: moodle_phpmyadmin
    restart: unless-stopped
    environment:
      PMA_HOST: db
      PMA_PORT: 3306
      UPLOAD_LIMIT: 128M
    ports:
      - "${PMA_PORT:-8081}:80"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - moodle-net

  mailpit:
    image: axllent/mailpit:latest
    container_name: moodle_mailpit
    restart: unless-stopped
    ports:
      - "${MAILPIT_WEB_PORT:-8025}:8025"
      - "${MAILPIT_SMTP_PORT:-1025}:1025"
    networks:
      - moodle-net

volumes:
  db_data:

networks:
  moodle-net:
    driver: bridge
